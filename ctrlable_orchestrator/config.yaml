---
name: "Ctrlable Orchestrator"
version: "1.0.0"
slug: "ctrlable_orchestrator"
description: "Open the Ctrlable Orchestrator (appliance provisioner) from inside Ctrlable Pro"
url: "https://github.com/Ctrlable/ha-addon"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

# Served through HA ingress: the orchestrator UI appears in the sidebar,
# reachable from anywhere Ctrlable Pro is (LAN, or remotely via the portal
# tunnel) without knowing the orchestrator's IP.
ingress: true
ingress_port: 8099
panel_icon: mdi:server-network
panel_title: "Orchestrator"

# host_network so the add-on sees the site LAN directly and can AUTO-DISCOVER
# the orchestrator on it (scan for the /api/whoami signature). No IP to enter.
host_network: true

startup: application
boot: auto
init: false

options:
  # Leave host blank for auto-discovery (the default). Set it only to pin a
  # specific orchestrator, e.g. on a multi-subnet site where the scan can't see it.
  host: ""
  port: 8000
  log_level: "info"

schema:
  host: "str?"
  port: "port?"
  log_level: "list(debug|info|warning|error)?"

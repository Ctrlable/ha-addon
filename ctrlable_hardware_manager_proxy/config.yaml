---
name: "Ctrlable Hardware Manager Proxy"
description: >-
  Provision and manage the hardware behind Ctrlable Pro — USB audio cards, hubs,
  capture inputs, zones, voice assistants and snapcast clients — from a panel
  inside Home Assistant.
version: "0.1.1"
slug: "ctrlable_hardware_manager_proxy"
url: "https://github.com/Ctrlable/ha-addon"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

# Ingress, so the panel appears inside Ctrlable Pro and inherits its login. HA has
# already authenticated the person by the time a request reaches this addon, which
# is why the proxy holds a service key rather than asking for a second password.
ingress: true
ingress_port: 8099
panel_icon: mdi:expansion-card-variant
panel_title: Hardware

# NOT exposed on a host port. The manager already listens on the LAN; publishing a
# second door to the same room would only add a way in that bypasses HA's auth.
init: false
startup: application
boot: auto

options:
  # No default. The add-on cannot know where the manager runs, and a guess that
  # happens to be some other network's address is worse than an empty field: it
  # fails by quietly talking to a stranger's host rather than by saying it is
  # unconfigured. str rather than url so an empty value is allowed to reach run.sh,
  # which refuses it with an explanation.
  manager_url: ""
  service_key: ""
  verify_tls: false

schema:
  manager_url: str
  service_key: password?
  verify_tls: bool?

